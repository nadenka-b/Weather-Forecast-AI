[tool.poetry]
name = "weather-forecast-ai"
version = "0.1.0"
description = "Мультиагентная платформа прогнозирования погодных временных рядов (температура, осадки) — курсовой проект MLF-2026"
authors = ["Балабанова Надежда", "Саттарова Аделина"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
# --- API / ядро ---
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = "^2.9"
pydantic-settings = "^2.6"
python-multipart = "^0.0.17"
# --- БД ---
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
aiosqlite = "^0.20"
asyncpg = "^0.30"
alembic = "^1.13"
# --- Данные / ML ---
pandas = "^2.2"
numpy = "^2.1"
scipy = "^1.14"
scikit-learn = "^1.5"
statsmodels = "^0.14"
pmdarima = "^2.0"
prophet = "^1.1"
xgboost = "^2.1"
lightgbm = "^4.5"
tsfresh = "^0.20"
# --- LLM / RAG ---
transformers = "^4.46"
sentence-transformers = "^3.2"
qdrant-client = "^1.12"
rank-bm25 = "^0.2"
tiktoken = "^0.8"
httpx = "^0.27"
# --- Фоновые задачи / кэш ---
redis = "^5.2"
celery = "^5.4"
# --- Безопасность ---
passlib = { extras = ["bcrypt"], version = "^1.7" }
# bcrypt 5.x ломает passlib 1.7.4 (нет __about__) — фиксируем верхнюю границу
bcrypt = ">=4.1,<5.0"
pyjwt = "^2.9"
email-validator = "^2.2"
# --- Датасеты / визуализация ---
kagglehub = "^0.2"
datasets = "^3.1"
plotly = "^5.24"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
respx = "^0.21"
ruff = "^0.7"

# Бонус (+5%): TS Foundation Models для режима +foundation (Этапы 7/13).
# Установка: poetry install --with foundation
[tool.poetry.group.foundation]
optional = true

[tool.poetry.group.foundation.dependencies]
chronos-forecasting = ">=1.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
source = ["backend"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
