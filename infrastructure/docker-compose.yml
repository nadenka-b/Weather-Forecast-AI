# Полный стек: db (PostgreSQL) + redis + qdrant + app + worker + beat + nginx.
# LM Studio запускается на хосте (не в контейнере): host.docker.internal:1234.
# Streamlit — отдельный dev-инструмент на хосте, в compose его нет (методичка Step_12).
# Перед запуском: cp .env.example .env и задайте JWT_SECRET.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - weather_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather_internal

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - weather_internal

  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # LM Studio на хосте (Linux)
    volumes:
      - ../backend:/app/backend
      - ../logs:/app/logs
      # holdout-набор для /api/v1/evaluate (создаётся generate_knowledge_base.py)
      - ../data/processed:/app/data/processed:ro
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command:
      - uvicorn
      - backend.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - weather_internal

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - ../backend:/app/backend
      - ../logs:/app/logs
      - ../data/processed:/app/data/processed:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - backend.worker.celery_app
      - worker
      - --loglevel=info
      - --queues=forecast
      - --concurrency=1
    restart: unless-stopped
    networks:
      - weather_internal

  # Планировщик: ежедневная очистка кэша (beat_schedule в celery_app)
  beat:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - ../backend:/app/backend
      - ../logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - backend.worker.celery_app
      - beat
      - --loglevel=info
    restart: unless-stopped
    networks:
      - weather_internal

  # Обратный прокси: проксирует только app:8000 (API); security headers, gzip
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../static:/usr/share/nginx/html/static:ro
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - weather_internal


volumes:
  postgres_data:
    name: weather_postgres_data
  qdrant_data:
    name: weather_qdrant_data


networks:
  weather_internal:
    name: weather_internal
    driver: bridge
