# Стек Этапов 12–14: db (PostgreSQL) + redis + app + worker + beat (Celery).
# Qdrant и nginx добавляются на Этапе 15.
# Перед запуском: cp .env.example .env и задайте JWT_SECRET.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - weather_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather_internal

  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
      - ../logs:/app/logs
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command:
      - uvicorn
      - backend.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - backend
    networks:
      - weather_internal

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - ../backend:/app/backend
      - ../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - backend.worker.celery_app
      - worker
      - --loglevel=info
      - --queues=forecast
      - --concurrency=1
    restart: unless-stopped
    networks:
      - weather_internal

  # Планировщик: ежедневная очистка кэша (beat_schedule в celery_app)
  beat:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - ../backend:/app/backend
      - ../logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - backend.worker.celery_app
      - beat
      - --loglevel=info
    restart: unless-stopped
    networks:
      - weather_internal


volumes:
  postgres_data:
    name: weather_postgres_data


networks:
  weather_internal:
    name: weather_internal
    driver: bridge
