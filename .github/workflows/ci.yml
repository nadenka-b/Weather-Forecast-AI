# CI/CD (методичка Step_12, задание MLF: «GitHub Actions — тесты, линтер, покрытие»).
#
# Ставится лёгкое подмножество зависимостей (requirements-ci.txt): без torch,
# Prophet/CmdStan и тяжёлых датасетных пакетов — тесты их не требуют.
# Полный набор зависимостей фиксируется poetry.lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies (CI subset)
        run: python -m pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check backend tests scripts streamlit_app

      - name: Tests with coverage (>= 70%)
        run: pytest tests -q --cov=backend --cov-report=term-missing --cov-fail-under=70
